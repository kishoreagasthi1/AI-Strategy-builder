name: CI

# Gap flagged in the v5.x SaaS build: tests only ever ran locally via
# `npm test`/`npm run test:rls` — nothing ran them automatically on push, so
# a regression (or, as happened once in production, a migration that never
# got applied) had no automated backstop. This workflow is that backstop:
# typecheck + the full RLS-gated suite against a real ephemeral Postgres,
# on every push and PR.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyne
          POSTGRES_PASSWORD: vyne
          POSTGRES_DB: vyne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyne"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Migrations run as the DB owner (vyne) — migration 001_core.sql
      # creates the restricted vyne_app role itself (CREATE ROLE IF NOT
      # EXISTS), so nothing else needs to provision it ahead of time.
      TEST_DATABASE_URL: postgres://vyne:vyne@localhost:5432/vyne
      RLS_APP_URL: postgres://vyne_app:change-me-via-ops@localhost:5432/vyne
      DATABASE_URL: postgres://vyne:vyne@localhost:5432/vyne
      RLS_TEST: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Apply migrations (creates vyne_app role as a side effect)
        working-directory: backend
        run: npm run migrate

      - name: Full test suite (unit + RLS-gated integration)
        working-directory: backend
        run: npm run test:full

  # Fast, no-DB-needed sanity check that every shipped frontend page parses
  # as valid HTML and the version stamp is internally consistent. Doesn't
  # replace the backend/frontend version-parity unit test (test/version.test.ts,
  # which already runs as part of the backend job above) — this is a second,
  # independent check that catches a broken/truncated file even if that
  # specific test somehow didn't.
  frontend-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every shipped HTML file is well-formed and non-empty
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in frontend/*.html; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 100 ]; then
              echo "::error file=$f::file is suspiciously small ($size bytes)"
              fail=1
            fi
            if ! grep -q "</html>" "$f"; then
              echo "::error file=$f::missing closing </html> tag (truncated file?)"
              fail=1
            fi
            # about.html is deliberately standalone (see its own doc comment
            # on why); admin.html is the operator-only console gated by
            # SIGNUP_ACCESS_KEY instead of Identity Platform login, so it
            # doesn't use the tenant-user session bridge either. terms.html/
            # privacy.html/dpa.html (v5.30) are legal pages that must be
            # reachable without a session, same reasoning as about.html.
            # Every other module page must load the shared bridge.
            case "$f" in
              frontend/about.html|frontend/admin.html|frontend/terms.html|frontend/privacy.html|frontend/dpa.html) ;;
              *)
                if ! grep -q 'src="vyne-client.js"' "$f"; then
                  echo "::error file=$f::missing <script src=\"vyne-client.js\"> — module pages must load the shared bridge"
                  fail=1
                fi
                ;;
            esac
          done
          exit $fail

  # ── Browser end-to-end suites ─────────────────────────────────────────────
  #
  # v5.32.69. These existed and ran nowhere. Every one of them was written
  # because a source-level check had already failed to catch the class of bug
  # in question — a tab that was never wired into showTab, a score movement
  # anchored to the wrong turn, a state journal that never survived a save.
  # Backend tests cannot see any of that: it only exists once a real browser
  # loads the real page.
  #
  # They ran only when someone remembered to run them by hand, which meant the
  # next person to edit roadmap.html or interview_agent.html had no backstop at
  # all. That is the gap this job closes.
  #
  # No database and no network: each suite starts its own stub server and
  # answers every API call itself, so this job is fast and cannot flake on
  # Postgres. Playwright is installed here rather than added to
  # backend/package.json because nothing in the shipped runtime needs it.
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The suites live in frontend/test but import playwright, which resolves
      # by walking up from that directory. Installing it at the repo root is
      # what puts it on that path for both locations.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright ws
          npx playwright install --with-deps chromium

      - name: Browser suites
        run: |
          set -uo pipefail
          fail=0
          for f in frontend/test/*.mjs; do
            echo "::group::$(basename "$f")"
            if node "$f"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$f::browser suite failed"
              fail=1
            fi
          done
          exit $fail

      # The full pre-engagement → interview → scoring → synthesis → roadmap
      # walk. Slower than the rest put together and the only test that covers
      # the handoffs BETWEEN modules, which is where this product has broken
      # most often.
      - name: Full-flow end-to-end
        working-directory: backend
        run: npx tsx test/full-flow-e2e.mts
