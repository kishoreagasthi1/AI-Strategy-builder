services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vyne
      POSTGRES_PASSWORD: vyne
      POSTGRES_DB: vyne
    ports:
      - "5432:5432"
    volumes:
      - vyne_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyne"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vyne_pgdata:
