<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VYNE™ Account &amp; Subscription</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>window.VYNE_MODULE = "account";</script>
<script src="vyne-client.js"></script>
<style>
/* Foundry design system — matches billing.html/scorecard.html. */
:root{
  --navy:#01203D;--navy-2:#0A2E4D;--ink:#132433;--paper:#F3F1EB;--panel:#FFFFFF;
  --panel-raised:#FAF8F3;--line:#E8E3D8;--line-strong:#D8D3C7;--quiet:#6C7783;--quiet-soft:#9AA4AE;
  --gold:#A88553;--gold-2:#C6A46B;--signal-bg:#F4ECDD;--live:#2F7D4F;--live-bg:#E9F2EC;
  --warn:#A9761C;--warn-bg:#F8EFDC;--danger:#B0324B;--danger-bg:#F7E7EB;
  --r-sm:9px;--r-lg:14px;--r-pill:999px;
  --shadow:0 1px 2px rgba(16,33,47,.05),0 10px 30px rgba(16,33,47,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums}
.page{max-width:960px;margin:0 auto;padding:2rem}
a{color:var(--gold);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:1rem;border-bottom:1px solid rgba(184,151,42,0.3)}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-hex{width:40px;height:40px}
.logo-text{font-family:'Space Grotesk','Inter',sans-serif;font-size:18px;color:#132433;letter-spacing:0.08em}
.logo-sub{font-size:10px;color:#7A5C1E;letter-spacing:0.2em;text-transform:uppercase;display:block}
.header-title{font-family:'Space Grotesk','Inter',sans-serif;font-size:22px;color:#132433}
.header-sub{font-size:12px;color:#46535F;margin-top:2px}
.sub{font-size:12px;color:var(--quiet);margin-bottom:18px}
.panel{background:var(--panel-raised);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.panel h2{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px;color:var(--gold)}
button{background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 17px;
  font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,transform .08s}
button:hover{background:var(--navy-2)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line-strong)}
button.ghost:hover{background:rgba(1,32,61,0.05);border-color:var(--gold)}
.badge{display:inline-block;border-radius:var(--r-pill);padding:3px 11px;font-size:11px;font-weight:600}
.badge.active{background:var(--live-bg);color:var(--live)}
.badge.trialing{background:var(--signal-bg);color:#7A5C1E}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.msg{font-size:12.5px;color:var(--quiet);margin-top:10px;min-height:16px;line-height:1.5}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--live)}
.hint{font-size:11.5px;color:var(--quiet-soft);line-height:1.6;margin-top:8px}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.plan-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;display:flex;flex-direction:column;gap:8px}
.plan-card.current{border-color:var(--gold-2);box-shadow:0 0 0 1px var(--gold-2) inset}
.plan-name{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--navy)}
.plan-price{font-size:20px;font-weight:700;color:var(--ink)}
.plan-price small{font-size:11px;font-weight:500;color:var(--quiet)}
.current-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat{min-width:130px}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--navy)}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet-soft);margin-top:2px}
</style>
</head>
<body>
<div class="page">
<div class="header">
  <div class="logo-row">
    <svg class="logo-hex" viewBox="0 0 40 40" fill="none">
      <polygon points="20,2 36,10 36,30 20,38 4,30 4,10" fill="none" stroke="#C6A46B" stroke-width="1.8"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="#C6A46B" stroke-width="1.4"/>
      <line x1="14" y1="26" x2="26" y2="14" stroke="#C6A46B" stroke-width="1.4"/>
    </svg>
    <div>
      <div class="logo-text">VYNORA</div>
      <span class="logo-sub">Account</span>
    </div>
  </div>
  <div style="text-align:right">
    <div class="header-title">Account &amp; Subscription</div>
    <div class="header-sub">What your firm pays to run VYNE — separate from client cost-recovery billing</div>
  </div>
</div>
<div class="sub vyne-home-btn"><a href="index.html">← Back to modules</a></div>

<div id="checkout-msg" class="msg" style="display:none"></div>

<div class="panel">
  <h2>Current plan</h2>
  <div id="current-container"><div class="hint">Loading…</div></div>
</div>

<div class="panel">
  <h2>Plans</h2>
  <div class="hint" style="margin:0">
    Illustrative pricing — your firm's actual terms may differ; contact Vynora if you're unsure which plan applies.
  </div>
  <div id="plans-container" class="plan-grid"><div class="hint">Loading…</div></div>
</div>

</div><!-- /.page -->

<script>
var API_BASE = window.VYNE_API_BASE || "";

// Owner-only module — every /api/subscription* route is owner-gated
// server-side too, but bouncing early avoids a confusing wall of 403s.
(function(){
  var s = vyneAuth.session();
  if (s && s.role !== "owner") window.location.href = "index.html";
})();

function esc(t){ var d=document.createElement('div'); d.textContent=t==null?'':String(t); return d.innerHTML; }
function money(n){ return n == null ? "—" : "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function statusBadgeClass(status){
  if (status === "active") return "active";
  if (status === "trialing") return "trialing";
  if (status === "past_due" || status === "incomplete" || status === "unpaid") return "warn";
  return "danger";
}

var currentPlanKey = null;

async function loadCurrent(){
  var box = document.getElementById("current-container");
  try{
    var d = await vyneAuth.api("/api/subscription");
    currentPlanKey = d.planKey;
    var badgeClass = statusBadgeClass(d.subscriptionStatus);
    var periodEnd = d.currentPeriodEnd ? new Date(d.currentPeriodEnd).toLocaleDateString() : null;
    box.innerHTML =
      "<div class='current-row'>" +
        "<div class='stat'><div class='stat-num'>" + esc(d.planName || d.planKey) + "</div><div class='stat-label'>Plan</div></div>" +
        "<div class='stat'><div class='stat-num'><span class='badge " + badgeClass + "'>" + esc(d.subscriptionStatus) + "</span></div><div class='stat-label'>Status</div></div>" +
        (periodEnd ? "<div class='stat'><div class='stat-num' style='font-size:14px'>" + esc(periodEnd) + "</div><div class='stat-label'>" + (d.cancelAtPeriodEnd ? "Cancels" : "Renews") + "</div></div>" : "") +
      "</div>" +
      (d.hasStripeCustomer
        ? "<div style='margin-top:16px'><button class='ghost' onclick='openPortal()' id='portal-btn'>Manage billing (Stripe)</button></div>"
        : "<div class='hint' style='margin-top:12px'>No billing account yet — subscribe to a plan below to start one.</div>");
  }catch(e){ box.innerHTML = "<div class='msg err'>Failed to load: " + esc(e.message) + "</div>"; }
}

async function loadPlans(){
  var box = document.getElementById("plans-container");
  try{
    var d = await vyneAuth.api("/api/plans");
    box.innerHTML = d.plans.filter(function(p){ return p.purchasable; }).map(function(p){
      var isCurrent = p.key === currentPlanKey;
      var priceStr = p.monthlyPriceUsd == null ? "Contact us" : (money(p.monthlyPriceUsd) + "<small> /mo</small>");
      var btn = isCurrent
        ? "<button class='ghost' disabled>Current plan</button>"
        : (p.configured
            ? "<button onclick=\"subscribe('" + p.key + "')\" id='sub-btn-" + p.key + "'>Subscribe</button>"
            : "<button class='ghost' disabled title='Not yet available for self-serve checkout'>Contact sales</button>");
      return "<div class='plan-card" + (isCurrent ? " current" : "") + "'>" +
        "<div class='plan-name'>" + esc(p.name) + "</div>" +
        "<div class='plan-price'>" + priceStr + "</div>" +
        btn +
      "</div>";
    }).join("");
  }catch(e){ box.innerHTML = "<div class='msg err'>Failed to load: " + esc(e.message) + "</div>"; }
}

async function subscribe(planKey){
  var btn = document.getElementById("sub-btn-" + planKey);
  if (btn) { btn.disabled = true; btn.textContent = "Redirecting…"; }
  try{
    var d = await vyneAuth.api("/api/subscription/checkout", { method: "POST", body: { planKey: planKey } });
    window.location.href = d.url;
  }catch(e){
    alert("Couldn't start checkout: " + (e.body && e.body.detail ? e.body.detail : e.message));
    if (btn) { btn.disabled = false; btn.textContent = "Subscribe"; }
  }
}

async function openPortal(){
  var btn = document.getElementById("portal-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Redirecting…"; }
  try{
    var d = await vyneAuth.api("/api/subscription/portal", { method: "POST" });
    window.location.href = d.url;
  }catch(e){
    alert("Couldn't open billing portal: " + (e.body && e.body.detail ? e.body.detail : e.message));
    if (btn) { btn.disabled = false; btn.textContent = "Manage billing (Stripe)"; }
  }
}

// Stripe redirects back here with ?checkout=success|cancelled after Checkout.
(function(){
  var qs = new URLSearchParams(window.location.search);
  var outcome = qs.get("checkout");
  if (!outcome) return;
  var box = document.getElementById("checkout-msg");
  box.style.display = "block";
  if (outcome === "success") { box.className = "msg ok"; box.textContent = "Subscription updated — it may take a few seconds to reflect below."; }
  else { box.className = "msg"; box.textContent = "Checkout cancelled — no changes were made."; }
  history.replaceState(null, "", window.location.pathname);
})();

loadCurrent().then(loadPlans);
</script>
</body>
</html>
